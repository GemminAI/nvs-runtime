name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install nvs-observation (not on PyPI yet)
        run: pip install "git+https://github.com/GemminAI/nvs-observation.git"
      - name: Install
        run: pip install -e ".[dev,replay]"
      - name: Lint
        run: ruff check src tests
      - name: Typecheck
        run: mypy src
      # The public CI has neither the NVS-Kernel edge package nor sensos, so coverage is reported
      # here, not gated. The gate (fail_under = 90, pyproject.toml) is required in a full
      # environment where the kernel and sensos are installed.
      - name: Test
        run: pytest --cov=nvs_runtime --cov-report=term-missing --cov-fail-under=0
      - name: Examples
        run: |
          python examples/hello_runtime.py
          python examples/plan_and_invoke.py
